# Uruchamiane na zmienionych plikach. Instalacja: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      # pl_places.marisa ma ok. 2,4 MB od 0.3.0 (formy odmienione z SGJP);
      # limit chroni przed przypadkowym dodaniem dużych plików innego typu.
      - id: check-added-large-files
        args: [--maxkb=4096]
