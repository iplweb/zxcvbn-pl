[project]
name = "zxcvbn-pl"
version = "0.3.0"
description = "Polish dictionaries (common words, first and last names, place names, with inflected forms) for zxcvbn password strength estimation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michał Pasternak", email = "m@iplweb.pl" }]
keywords = ["zxcvbn", "password", "password-strength", "polish", "dictionary", "hasło", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Polish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "marisa-trie>=1.0",
    "zxcvbn>=4.4",
]

[project.urls]
Homepage = "https://github.com/iplweb/zxcvbn-pl"
Repository = "https://github.com/iplweb/zxcvbn-pl"
Changelog = "https://github.com/iplweb/zxcvbn-pl/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zxcvbn_pl"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "README.md", "LICENSE", "LICENSE.sgjp", "NOTICE.md", "CHANGELOG.md"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
